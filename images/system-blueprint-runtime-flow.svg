<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="160" y1="40" x2="1420" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1A30"/>
      <stop offset="1" stop-color="#08101D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <style>
      .title { fill:#EAF2FF; font: 700 44px 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill:#9FB0CF; font: 400 18px 'Segoe UI', Arial, sans-serif; }
      .lane { fill:#DCE7FF; font: 700 18px 'Segoe UI', Arial, sans-serif; }
      .node-title { fill:#F6FAFF; font: 700 17px 'Segoe UI', Arial, sans-serif; }
      .node-copy { fill:#B6C7E4; font: 400 13px 'Segoe UI', Arial, sans-serif; }
      .chip { fill:#DCE7FF; font: 600 13px 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>
  <text x="88" y="92" class="title">Runtime Flow · From Request to Diagram</text>
  <text x="88" y="126" class="subtitle">A request is structured, routed, rendered, and returned as a polished system blueprint.</text>

  <g opacity="0.12">
    <path d="M80 184H1520M80 344H1520M80 504H1520M80 664H1520M80 824H1520" stroke="#DCE7FF"/>
  </g>

  <text x="100" y="176" class="lane">1. Input</text>
  <text x="100" y="336" class="lane">2. Extract &amp; Normalize</text>
  <text x="100" y="496" class="lane">3. Compose &amp; Render</text>
  <text x="100" y="656" class="lane">4. Deliver &amp; Iterate</text>

  <g filter="url(#shadow)">
    <rect x="210" y="204" width="220" height="90" rx="22" fill="#10324B" stroke="#57CFFF" stroke-opacity="0.38"/>
    <text x="244" y="243" class="node-title">User Prompt</text>
    <text x="244" y="268" class="node-copy">Codebase, spec, Mermaid, or plain-language request</text>

    <rect x="500" y="204" width="220" height="90" rx="22" fill="#10324B" stroke="#57CFFF" stroke-opacity="0.38"/>
    <text x="534" y="243" class="node-title">Skill Trigger</text>
    <text x="534" y="268" class="node-copy">Detect architecture, topology, flow, or blueprint intent</text>

    <rect x="790" y="204" width="220" height="90" rx="22" fill="#10324B" stroke="#57CFFF" stroke-opacity="0.38"/>
    <text x="824" y="243" class="node-title">Scope Decision</text>
    <text x="824" y="268" class="node-copy">Overview, runtime, memory flow, deployment, compare</text>

    <rect x="1080" y="204" width="220" height="90" rx="22" fill="#10324B" stroke="#57CFFF" stroke-opacity="0.38"/>
    <text x="1116" y="243" class="node-title">Output Mode</text>
    <text x="1116" y="268" class="node-copy">HTML + SVG first, Mermaid only when explicitly needed</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="260" y="364" width="240" height="94" rx="22" fill="#133024" stroke="#52E6B2" stroke-opacity="0.36"/>
    <text x="294" y="404" class="node-title">Model Extraction</text>
    <text x="294" y="429" class="node-copy">Identify nodes, groups, boundaries, and flows</text>

    <rect x="580" y="364" width="240" height="94" rx="22" fill="#133024" stroke="#52E6B2" stroke-opacity="0.36"/>
    <text x="616" y="404" class="node-title">System Simplification</text>
    <text x="616" y="429" class="node-copy">Collapse noisy details into meaningful layers</text>

    <rect x="900" y="364" width="240" height="94" rx="22" fill="#133024" stroke="#52E6B2" stroke-opacity="0.36"/>
    <text x="940" y="404" class="node-title">Visual Grammar</text>
    <text x="940" y="429" class="node-copy">Map roles to semantic color and card styles</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="220" y="524" width="260" height="94" rx="22" fill="#2E1A49" stroke="#D5AAFF" stroke-opacity="0.36"/>
    <text x="258" y="564" class="node-title">Template Composition</text>
    <text x="258" y="589" class="node-copy">Inject title, legend, cards, and diagram scene</text>

    <rect x="540" y="524" width="260" height="94" rx="22" fill="#2E1A49" stroke="#D5AAFF" stroke-opacity="0.36"/>
    <text x="580" y="564" class="node-title">SVG Rendering</text>
    <text x="580" y="589" class="node-copy">Place nodes, routes, groups, and labels cleanly</text>

    <rect x="860" y="524" width="260" height="94" rx="22" fill="#2E1A49" stroke="#D5AAFF" stroke-opacity="0.36"/>
    <text x="896" y="564" class="node-title">Self-contained File</text>
    <text x="896" y="589" class="node-copy">Inline CSS, inline SVG, no external runtime required</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="316" y="684" width="250" height="94" rx="22" fill="#4A3210" stroke="#FFD27F" stroke-opacity="0.36"/>
    <text x="354" y="724" class="node-title">README / Docs</text>
    <text x="354" y="749" class="node-copy">Use in repositories, RFCs, internal docs, and demos</text>

    <rect x="676" y="684" width="250" height="94" rx="22" fill="#4A3210" stroke="#FFD27F" stroke-opacity="0.36"/>
    <text x="716" y="724" class="node-title">Feedback Loop</text>
    <text x="716" y="749" class="node-copy">Add components, revise flow, change visual emphasis</text>

    <rect x="1036" y="684" width="250" height="94" rx="22" fill="#4A3210" stroke="#FFD27F" stroke-opacity="0.36"/>
    <text x="1074" y="724" class="node-title">Iterated Output</text>
    <text x="1074" y="749" class="node-copy">Keep the same visual language while refining content</text>
  </g>

  <g stroke-linecap="round" stroke-width="5">
    <path d="M430 249H500" stroke="#7FDBFF"/>
    <path d="M720 249H790" stroke="#7FDBFF"/>
    <path d="M1010 249H1080" stroke="#7FDBFF"/>

    <path d="M1190 294V344H380V364" stroke="#7FDBFF"/>
    <path d="M500 411H580" stroke="#7EF0C6"/>
    <path d="M820 411H900" stroke="#7EF0C6"/>

    <path d="M1020 458V504H350V524" stroke="#D5AAFF"/>
    <path d="M480 571H540" stroke="#D5AAFF"/>
    <path d="M800 571H860" stroke="#D5AAFF"/>

    <path d="M990 618V664H440V684" stroke="#FFD27F"/>
    <path d="M566 731H676" stroke="#FFD27F"/>
    <path d="M926 731H1036" stroke="#FFD27F"/>
  </g>

  <rect x="88" y="888" width="164" height="38" rx="19" fill="#142238" stroke="#3D5E8D" stroke-opacity="0.4"/>
  <circle cx="114" cy="907" r="6" fill="#57CFFF"/>
  <text x="130" y="912" class="chip">Input Layer</text>
  <rect x="268" y="888" width="206" height="38" rx="19" fill="#142238" stroke="#3D5E8D" stroke-opacity="0.4"/>
  <circle cx="294" cy="907" r="6" fill="#52E6B2"/>
  <text x="310" y="912" class="chip">Structure Extraction</text>
  <rect x="490" y="888" width="188" height="38" rx="19" fill="#142238" stroke="#3D5E8D" stroke-opacity="0.4"/>
  <circle cx="516" cy="907" r="6" fill="#D5AAFF"/>
  <text x="532" y="912" class="chip">Rendering Layer</text>
  <rect x="694" y="888" width="184" height="38" rx="19" fill="#142238" stroke="#3D5E8D" stroke-opacity="0.4"/>
  <circle cx="720" cy="907" r="6" fill="#FFD27F"/>
  <text x="736" y="912" class="chip">Delivery Loop</text>
</svg>

<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="160" y1="60" x2="1400" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1930"/>
      <stop offset="1" stop-color="#08111E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { fill:#EAF2FF; font:700 44px 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill:#9FB0CF; font:400 18px 'Segoe UI', Arial, sans-serif; }
      .group-title { fill:#F3F7FF; font:700 22px 'Segoe UI', Arial, sans-serif; }
      .group-copy { fill:#AFC0DF; font:400 14px 'Segoe UI', Arial, sans-serif; }
      .node-title { fill:#F7FAFF; font:700 17px 'Segoe UI', Arial, sans-serif; }
      .node-copy { fill:#AFC0DF; font:400 13px 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>
  <text x="92" y="92" class="title">Deployment Topology · Example View</text>
  <text x="92" y="126" class="subtitle">A presentation-style topology diagram for docs, README pages, and stakeholder reviews.</text>

  <g filter="url(#shadow)">
    <rect x="110" y="188" width="250" height="140" rx="28" fill="#10324B" stroke="#57CFFF" stroke-opacity="0.36"/>
    <text x="142" y="234" class="group-title">Users</text>
    <text x="142" y="264" class="group-copy">Browser / Mobile / Internal tools</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="438" y="150" width="694" height="290" rx="32" fill="#11243E" stroke="#7CA6FF" stroke-opacity="0.28"/>
    <text x="474" y="196" class="group-title">Cloud Edge & Application Zone</text>
    <text x="474" y="224" class="group-copy">Public ingress, application runtime, and orchestration layer.</text>

    <rect x="478" y="268" width="170" height="84" rx="20" fill="#143B57" stroke="#86DEFF" stroke-opacity="0.34"/>
    <text x="521" y="304" class="node-title">CDN / WAF</text>
    <text x="521" y="328" class="node-copy">Public edge</text>

    <rect x="698" y="268" width="170" height="84" rx="20" fill="#143228" stroke="#7EF0C6" stroke-opacity="0.34"/>
    <text x="744" y="304" class="node-title">FastAPI</text>
    <text x="744" y="328" class="node-copy">App API</text>

    <rect x="918" y="268" width="170" height="84" rx="20" fill="#143228" stroke="#7EF0C6" stroke-opacity="0.34"/>
    <text x="954" y="304" class="node-title">Agent Core</text>
    <text x="954" y="328" class="node-copy">Routing + tools</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="434" y="528" width="724" height="244" rx="32" fill="#2A183F" stroke="#D1A5FF" stroke-opacity="0.30"/>
    <text x="470" y="574" class="group-title">Data & Memory Zone</text>
    <text x="470" y="602" class="group-copy">Durable state, plan store, and retrieval-aware memory layer.</text>

    <rect x="476" y="644" width="150" height="84" rx="20" fill="#321C4F" stroke="#DAB6FF" stroke-opacity="0.35"/>
    <text x="509" y="680" class="node-title">PostgreSQL</text>
    <text x="509" y="704" class="node-copy">Sessions / plans / trips</text>

    <rect x="688" y="644" width="150" height="84" rx="20" fill="#321C4F" stroke="#DAB6FF" stroke-opacity="0.35"/>
    <text x="732" y="680" class="node-title">Redis</text>
    <text x="732" y="704" class="node-copy">Cache / hot state</text>

    <rect x="900" y="644" width="150" height="84" rx="20" fill="#321C4F" stroke="#DAB6FF" stroke-opacity="0.35"/>
    <text x="940" y="680" class="node-title">Qdrant</text>
    <text x="940" y="704" class="node-copy">Knowledge / recall</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1214" y="188" width="270" height="584" rx="32" fill="#35240F" stroke="#F7B955" stroke-opacity="0.34"/>
    <text x="1248" y="234" class="group-title">External Services</text>
    <text x="1248" y="262" class="group-copy">Maps, weather, search, messaging, voice.</text>

    <rect x="1248" y="308" width="200" height="68" rx="18" fill="#4A3110" stroke="#FFD27F" stroke-opacity="0.35"/>
    <text x="1318" y="349" class="node-title">Maps API</text>
    <rect x="1248" y="406" width="200" height="68" rx="18" fill="#4A3110" stroke="#FFD27F" stroke-opacity="0.35"/>
    <text x="1307" y="447" class="node-title">Weather API</text>
    <rect x="1248" y="504" width="200" height="68" rx="18" fill="#4A3110" stroke="#FFD27F" stroke-opacity="0.35"/>
    <text x="1322" y="545" class="node-title">Search</text>
    <rect x="1248" y="602" width="200" height="68" rx="18" fill="#4A3110" stroke="#FFD27F" stroke-opacity="0.35"/>
    <text x="1296" y="643" class="node-title">Messaging / TTS</text>
  </g>

  <g stroke-linecap="round" stroke-width="5">
    <path d="M360 258H438" stroke="#7FDBFF"/>
    <path d="M648 310H698" stroke="#7FDBFF"/>
    <path d="M868 310H918" stroke="#7EF0C6"/>
    <path d="M1003 352V528H796" stroke="#D5AAFF"/>
    <path d="M1088 310H1214" stroke="#FFD27F"/>
  </g>
</svg>

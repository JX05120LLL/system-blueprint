<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1480" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1A30"/>
      <stop offset="1" stop-color="#07111E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { fill:#EAF2FF; font:700 44px 'Segoe UI', Arial, sans-serif; }
      .subtitle { fill:#9FB0CF; font:400 18px 'Segoe UI', Arial, sans-serif; }
      .panel-title { fill:#F4F8FF; font:700 24px 'Segoe UI', Arial, sans-serif; }
      .panel-copy { fill:#AFC0DF; font:400 14px 'Segoe UI', Arial, sans-serif; }
      .node-title { fill:#F7FAFF; font:700 16px 'Segoe UI', Arial, sans-serif; }
      .node-copy { fill:#B2C3E0; font:400 13px 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>
  <text x="92" y="92" class="title">Before / After Blueprint</text>
  <text x="92" y="126" class="subtitle">A useful view for architecture evolution, refactoring proposals, and system redesign conversations.</text>

  <g filter="url(#shadow)">
    <rect x="92" y="180" width="644" height="674" rx="32" fill="#17202E" stroke="#617899" stroke-opacity="0.26"/>
    <text x="128" y="230" class="panel-title">Before</text>
    <text x="128" y="258" class="panel-copy">Typical low-polish output: dense, flat, and harder to present.</text>

    <rect x="146" y="324" width="170" height="76" rx="18" fill="#253446" stroke="#758AA7" stroke-opacity="0.34"/>
    <text x="192" y="360" class="node-title">Frontend</text>
    <rect x="382" y="324" width="170" height="76" rx="18" fill="#253446" stroke="#758AA7" stroke-opacity="0.34"/>
    <text x="454" y="360" class="node-title">API</text>
    <rect x="264" y="482" width="170" height="76" rx="18" fill="#253446" stroke="#758AA7" stroke-opacity="0.34"/>
    <text x="314" y="518" class="node-title">Database</text>

    <path d="M316 362H382" stroke="#93A9C5" stroke-width="4" stroke-linecap="round"/>
    <path d="M466 400V482" stroke="#93A9C5" stroke-width="4" stroke-linecap="round"/>
    <path d="M264 520H212V400" stroke="#93A9C5" stroke-width="4" stroke-linecap="round"/>

    <text x="148" y="654" class="node-copy">• minimal grouping</text>
    <text x="148" y="682" class="node-copy">• no visual hierarchy</text>
    <text x="148" y="710" class="node-copy">• weak storytelling for docs and demos</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="864" y="180" width="644" height="674" rx="32" fill="#0F1B31" stroke="#7AA2F7" stroke-opacity="0.28"/>
    <text x="900" y="230" class="panel-title">After</text>
    <text x="900" y="258" class="panel-copy">System Blueprint style: stronger grouping, color semantics, and presentation quality.</text>

    <rect x="910" y="302" width="210" height="126" rx="22" fill="#0C2940" stroke="#57CFFF" stroke-opacity="0.36"/>
    <text x="952" y="346" class="node-title">Client Layer</text>
    <text x="952" y="372" class="node-copy">Browser / Mobile / Prompt UI</text>

    <rect x="1170" y="272" width="266" height="188" rx="26" fill="#10271F" stroke="#52E6B2" stroke-opacity="0.34"/>
    <text x="1210" y="316" class="node-title">Application Layer</text>
    <text x="1210" y="342" class="node-copy">API, routing, workflow, tool runtime</text>
    <rect x="1204" y="376" width="116" height="48" rx="16" fill="#143228" stroke="#7EF0C6" stroke-opacity="0.35"/>
    <text x="1237" y="406" class="node-title">API</text>
    <rect x="1334" y="376" width="70" height="48" rx="16" fill="#143228" stroke="#7EF0C6" stroke-opacity="0.35"/>
    <text x="1352" y="406" class="node-title">LLM</text>

    <rect x="1048" y="540" width="330" height="164" rx="26" fill="#2E1A49" stroke="#D5AAFF" stroke-opacity="0.34"/>
    <text x="1090" y="584" class="node-title">Data & Memory</text>
    <text x="1090" y="610" class="node-copy">Plans, trips, summaries, preferences, recall</text>

    <path d="M1120 365H1170" stroke="#7FDBFF" stroke-width="5" stroke-linecap="round"/>
    <path d="M1304 460V540" stroke="#D5AAFF" stroke-width="5" stroke-linecap="round"/>

    <text x="908" y="752" class="node-copy">• better grouping and semantic color</text>
    <text x="908" y="780" class="node-copy">• stronger story for README, docs, and presentations</text>
    <text x="908" y="808" class="node-copy">• ready for SVG, HTML, and raster export</text>
  </g>

  <path d="M736 516H864" stroke="#7AA2F7" stroke-width="6" stroke-linecap="round"/>
</svg>

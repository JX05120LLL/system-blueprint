      .node-copy { fill:#A9BCDC; font: 400 13px 'Segoe UI', Arial, sans-serif; }
      .chip { fill:#D9E8FF; font: 600 13px 'Segoe UI', Arial, sans-serif; }
      .label { fill:#9FB0CF; font: 500 14px 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>

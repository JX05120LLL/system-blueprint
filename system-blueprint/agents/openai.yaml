interface:
  display_name: "System Flow"
  short_description: "Reviewable software flows and architecture diagrams"
  default_prompt: "Use $system-flow to map this software system's components, dependencies, and request or data flow from the available evidence. Preserve conditions, directions, sources, and uncertainty in diagram.json; generate offline interactive HTML, inspect its layout and interactions, and export a complete SVG when requested. Choose a readable horizontal or vertical layout, let me review and correct existing diagram properties, and report what was actually verified."

interface:
  display_name: "System Blueprint"
  short_description: "Interactive offline diagrams with editable source data"
  default_prompt: "Use $system-blueprint to create or update a technical diagram. Read the modeling and visual references, preserve stable IDs, source evidence, all required conditions and loops, and distinguish confirmed, assumed and planned facts. Default to a light engineering style and deliver diagram.json plus a self-contained interactive HTML. The details panel lets a reviewer correct diagram properties and download revised JSON/HTML; this does not change the real system. Run the bundled validator and generator, inspect real browser rendering and interactions, then export full expanded SVG/PNG/JPEG as requested. Report actual verification and any limits; respect explicit Mermaid requests."
